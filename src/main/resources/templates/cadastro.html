<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | DG Master</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<header class="topbar topbar-light">
    <a class="brand" th:href="@{/catalogo}"><span class="brand-mark">DG</span><span>MASTER</span></a>
    <a class="nav-link" th:href="@{/login}">Ja tenho conta</a>
</header>
<main class="auth-layout">
    <section class="auth-story">
        <p class="eyebrow">SUA MESA, SEU ACERVO</p>
        <h1>Mais jogos. Mais historias para contar.</h1>
        <p>Crie uma conta de cliente para reservar e acompanhar seus alugueis em um so lugar.</p>
        <div class="story-rule"><span>02</span><span>Perfis de dependentes ficam na sua conta.</span></div>
    </section>
    <section class="auth-panel">
        <p class="eyebrow">NOVO CLIENTE</p>
        <h2>Criar conta</h2>
        <div class="notice notice-error" th:if="${erro}" th:text="${erro}"></div>
        <form th:action="@{/cadastro}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" autocomplete="name" maxlength="150" required>
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="dataNascimento">Data de nascimento</label>
            <input id="dataNascimento" name="dataNascimento" type="date" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" minlength="8" autocomplete="new-password" required>
            <button class="button button-primary button-wide" type="submit">Criar conta</button>
        </form>
    </section>
</main>
</body>
</html>
