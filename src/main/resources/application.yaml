spring:
  application:
    name: dgmaster

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dg_master_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: America/Sao_Paulo

  jackson:
    time-zone: America/Sao_Paulo

dgmaster:
  admin:
    # Chave exigida para criar contas de Gerente (/admin e /api/auth/cadastro-gerente).
    # Sem valor definido, o cadastro de gerentes fica desabilitado.
    chave-cadastro-gerente: ${DGMASTER_ADMIN_KEY:}
