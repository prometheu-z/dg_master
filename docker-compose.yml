version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dgmaster-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env (veja .env.example)}
      MYSQL_DATABASE: dg_master_db
      MYSQL_USER: dg_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env (veja .env.example)}
      TZ: America/Sao_Paulo
    command: ["--default-time-zone=America/Sao_Paulo"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/01_schema_objetos.sql:/docker-entrypoint-initdb.d/01_schema_objetos.sql:ro
      - ./db/02_app_permissions.sql:/docker-entrypoint-initdb.d/02_app_permissions.sql:ro
    networks:
      - dgmaster-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgmaster-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/dg_master_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DB_USERNAME: dg_app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env (veja .env.example)}
      DGMASTER_ADMIN_KEY: ${DGMASTER_ADMIN_KEY:-}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dgmaster-network

volumes:
  mysql-data:

networks:
  dgmaster-network:
    driver: bridge
